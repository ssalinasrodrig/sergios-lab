<style>
:root{box-sizing:border-box;--bg:#f4f8fa;--card:#fff;--tx:#12303d;--mu:#587482;--ln:#d5e2e8;--ac:#0e7c9b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a22;--card:#10252f;--tx:#e3f0f5;--mu:#8fb0be;--ln:#1f3a47;--ac:#5cc8e6}}
:root[data-theme="dark"]{--bg:#0a1a22;--card:#10252f;--tx:#e3f0f5;--mu:#8fb0be;--ln:#1f3a47;--ac:#5cc8e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#06222f,#0b4256);color:#e8f6fb;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;position:relative}
header img{width:84px;height:auto}h1{margin:0;font-size:1.5rem;font-weight:650}header p{margin:2px 0 0;color:#a9d3e2;font-size:.9rem}
.sem{font-size:.8rem!important;line-height:1.45;margin-top:8px!important;color:#c5e3ee!important}
.date{margin-left:auto;text-align:right;font-size:.8rem;color:#a9d3e2}.date b{display:block;color:#fff;font-size:.95rem}
.lb{margin-top:8px;display:inline-flex;border:1px solid #5cc8e6;border-radius:8px;overflow:hidden}.lb button{background:transparent;color:#a9d3e2;border:0;padding:4px 12px;font:600 .85rem inherit;cursor:pointer}.lb button.on{background:#5cc8e6;color:#06222f}
main{max-width:1180px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}.stat b{font-size:1.45rem;color:var(--ac);display:block}.stat span{font-size:.78rem;color:var(--mu)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tab,select,input[type=search]{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;font:inherit}
.tab{cursor:pointer}.tab.on{background:var(--ac);color:#04212b;border-color:var(--ac);font-weight:600}
label{font-size:.85rem;color:var(--mu);display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 310px;gap:12px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.pane{background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden;min-height:300px}
#viz{width:100%;height:560px;display:block}@media(max-width:820px){#viz{height:420px}}
#side{padding:12px;max-height:600px;overflow:auto;font-size:.88rem}#side h3{margin:0 0 6px;font-size:1rem}
.wk{border-top:1px solid var(--ln);padding:6px 0}.wk i{color:var(--mu);font-style:normal;font-size:.78rem}
.tg{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:0 8px;font-size:.72rem;margin:2px 2px 0 0;color:var(--mu)}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.85rem}.row .n{width:230px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .b{height:14px;background:var(--ac);border-radius:3px}
.sec{margin-top:16px}.sec h2{font-size:1.05rem;margin:0 0 8px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.box{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:.88rem}
.box a{color:var(--ac)}.note{color:var(--mu);font-size:.8rem}
footer{background:#06222f;color:#a9d3e2;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));font-size:.82rem;display:flex;gap:18px;flex-wrap:wrap;align-items:center}footer b{color:#fff}
.sc{overflow-x:auto;padding:6px}

sem:["Biólogo con maestría en restauración de ecosistemas y doctorado en recursos hídricos. Áreas de interés: ciencia y práctica ambiental del agua a escala de sitio y paisaje, a escala subnacional, nacional y regional. Especialista en ecohidrología, ecohidráulica, régimen de caudales e inundaciones, conectividad, conservación, manejo y restauración de ecosistemas acuáticos, resiliencia y adaptación al cambio climático. Interesado en el funcionamiento ecohidrológico de diferentes tipos de ríos y humedales, cómo éstos son dependientes de la variabilidad estacional e interanual de escurrimientos y los efectos potenciales del cambio climático tanto a nivel ecohidrológico como biótico y social.","Biologist with a master's in ecosystem restoration and a PhD in water resources. Areas of interest: environmental water science and practice at site and landscape scales, and at subnational, national and regional scales. Specialist in ecohydrology, ecohydraulics, flow regime and floods, connectivity, conservation, management and restoration of aquatic ecosystems, and climate change resilience and adaptation. Interested in the ecohydrological functioning of different types of rivers and wetlands, how they depend on the seasonal and inter-annual variability of runoff, and the potential effects of climate change at ecohydrological, biotic and social levels."],
